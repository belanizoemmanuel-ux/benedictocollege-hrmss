<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benedicto College – HR Management</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f4f5f9; color: #171a2b; }
    h1, h2, h3, .brand { font-family: 'Poppins', sans-serif; }
    :root {
      --navy: #0d1642; --navy-2: #141f5c; --navy-light: #1b2a70;
      --gold: #c99a3c; --green: #3aa65b; --red: #e0473c;
      --amber: #e2a63b; --bg: #f4f5f9; --card: #ffffff;
      --line: #e7e9f2; --ink: #171a2b; --sub: #6b7085; --orange: #e8722a;
      --bc-green: #0f2e1f; --bc-green-2: #1a4530;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #c9cce0; border-radius: 8px; }

    /* ═══════════════════════════════════════════════
       LOGIN / AUTH PAGE — Benedicto Portal
       two-panel layout, forest-green + gold crest
       palette, logo centered at the top of the brand
       panel, feature list, and a clean white login card.
       ═══════════════════════════════════════════════ */
    .auth-page {
      min-height: 100vh; display: flex; background: var(--bg);
    }
    .auth-brand-panel {
      flex: 1 1 46%; max-width: 560px; position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px;
      color: #fff;
      background: linear-gradient(160deg, #10233f 0%, #1c3a63 100%);
    }
    .auth-brand-content { position: relative; z-index: 1; text-align: center; max-width: 340px; margin: 0 auto; }
    .auth-logo-circle {
      width: 68px; height: 68px; border-radius: 50%; background: #fff;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;
      border: 3px solid var(--gold); box-shadow: 0 14px 34px rgba(0,0,0,0.35); overflow: hidden;
      animation: logoZoomIn 0.6s cubic-bezier(0.16,1,0.3,1);
    }
    .auth-logo-circle img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
    .auth-brand-name { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 14.5px; letter-spacing: 0.5px; line-height: 1.2; margin-bottom: 3px; }
    .auth-brand-tagline { font-size: 9.5px; letter-spacing: 1.6px; color: var(--gold); font-weight: 700; margin-bottom: 14px; }
    .auth-hero-title { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 800; line-height: 1.15; margin-bottom: 7px; }
    .auth-hero-rule { width: 40px; height: 3px; background: var(--gold); margin: 0 auto 10px; border-radius: 2px; }
    .auth-hero-sub { font-size: 12px; color: rgba(255,255,255,0.75); line-height: 1.5; margin-bottom: 0; }

    /* ─── Quick Time In / Time Out widget — bottom-left of the auth brand panel ─── */
    .auth-quick-attendance {
      position: relative; z-index: 1; width: 100%; max-width: 300px;
      margin: 28px auto 0; padding: 16px 18px 18px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
    }
    .aqa-clock-row { display: flex; align-items: baseline; justify-content: center; gap: 7px; margin-bottom: 3px; }
    .aqa-clock { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 23px; letter-spacing: 0.5px; color: #fff; }
    .aqa-ampm { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: 1.4px; }
    .aqa-date { text-align: center; font-size: 10px; color: rgba(255,255,255,0.55); margin-bottom: 12px; font-weight: 500; }
    .aqa-label { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.9px; color: var(--gold); margin-bottom: 8px; text-align: center; }
    .aqa-input {
      width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #fff; font-size: 12.5px; font-family: inherit;
      margin-bottom: 9px; text-align: center; letter-spacing: 0.4px;
    }
    .aqa-input::placeholder { color: rgba(255,255,255,0.42); }
    .aqa-input:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.12); }
    .aqa-btn-row { display: flex; gap: 9px; }
    .aqa-btn {
      flex: 1; padding: 10px 8px; border-radius: 10px; border: none; font-weight: 700; font-size: 11.5px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.15s;
      font-family: inherit;
    }
    .aqa-btn i { font-size: 14px; }
    .aqa-btn.aqa-in { background: #26533b; color: #d9f7e3; }
    .aqa-btn.aqa-in:hover:not(:disabled) { background: var(--green); color: #fff; transform: translateY(-2px); }
    .aqa-btn.aqa-out { background: #542722; color: #f7dcd9; }
    .aqa-btn.aqa-out:hover:not(:disabled) { background: var(--red); color: #fff; transform: translateY(-2px); }
    .aqa-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .aqa-status { margin-top: 9px; font-size: 10.5px; color: rgba(255,255,255,0.72); text-align: center; min-height: 14px; line-height: 1.4; }
    .aqa-status strong { color: #fff; }

    .auth-form-panel {
      flex: 1 1 54%; display: flex; align-items: center; justify-content: center; padding: 40px 24px;
      position: relative; overflow: hidden;
    }
    .auth-form-panel::before {
      content: ""; position: absolute; inset: -20px;
      background: url('/public/benedicto.jpg') center/cover no-repeat;
      filter: blur(9px) saturate(1.1);
      opacity: 0.45; z-index: 0;
    }
    .auth-form-panel::after {
      content: ""; position: absolute; inset: 0;
      background: rgba(244,245,249,0.72); z-index: 0;
    }
      .auth-card {
      position: relative; z-index: 1;
      background: #ffffff; border-radius: 22px; padding: 38px 34px 30px; max-width: 400px; width: 100%;
      box-shadow: 0 24px 60px rgba(13,22,66,0.16), 0 0 0 1px rgba(13,22,66,0.05);
      animation: authCardIn 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .auth-lock-badge {
      width: 52px; height: 52px; border-radius: 50%; background: #fdf3dd; color: var(--gold);
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      margin: 0 auto 14px; border: 1px solid #f1dfae;
    }
    .auth-card h2 { text-align: center; font-size: 22px; margin-bottom: 6px; color: #171a2b; font-weight: 700; }
    .auth-card .sub { text-align: center; color: var(--sub); font-size: 14px; margin-bottom: 26px; }
    .auth-card .field { margin-bottom: 16px; }
    .auth-card .field label { display: block; font-size: 12.5px; color: var(--sub); font-weight: 600; margin-bottom: 6px; }
    .auth-card .field input, .auth-card .field select {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #e0e2e8;
      background: #f5f6f8; font-size: 14px; font-family: inherit; transition: all 0.15s;
    }
      .auth-card .field input:focus, .auth-card .field select:focus {
      outline: none; border-color: var(--navy-light); background: #fff;
      box-shadow: 0 0 0 3px rgba(27,42,112,0.12);
    }
      .auth-card .btn {
      width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 15px;
      font-weight: 700; cursor: pointer; background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); color: #fff;
      transition: opacity 0.15s, transform 0.1s; margin-top: 4px;
      box-shadow: 0 10px 22px rgba(13,22,66,0.28);
    }
    .auth-card .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .auth-card .btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
    .auth-card .error-msg {
      background: #fde7e6; color: #b3271f; padding: 10px 14px; border-radius: 8px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    .auth-card .error-msg.show { display: block; }
    .auth-copyright { text-align: center; font-size: 11px; color: #a0a3b0; margin-top: 22px; letter-spacing: 0.3px; }

    @media (max-width: 900px) {
      .auth-brand-panel { display: none; }
      .auth-form-panel { padding: 20px; }
    }

    /* ─── Login logo zoom-in animation (badge on load) ─── */
    @keyframes logoZoomIn {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes authCardIn {
      0% { transform: translateY(18px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* ─── Full-screen zoom transition shown right after a successful login,
       before the dashboard takes over ─── */
      #loginTransition {
      position: fixed; inset: 0; z-index: 200; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 16px;
      background: radial-gradient(circle at 50% 40%, var(--navy-2) 0%, var(--navy) 70%);
      opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
    }
    #loginTransition.show { opacity: 1; pointer-events: all; }
    #loginTransition .lt-badge {
      width: 110px; height: 110px; border-radius: 50%; background: #fff; border: 5px solid var(--gold);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      animation: loginLogoBlast 0.9s cubic-bezier(0.19,1,0.22,1) forwards;
    }
    #loginTransition .lt-badge img {
      width: 100%; height: 100%; object-fit: contain; padding: 6px;
      filter: blur(10px); opacity: 0;
      animation: loginLogoBlurIn 0.9s ease forwards;
    }
    @keyframes loginLogoBlurIn {
      0% { filter: blur(10px); opacity: 0; }
      45% { filter: blur(3px); opacity: 1; }
      100% { filter: blur(0); opacity: 1; }
    }
    #loginTransition .lt-text {
      color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px;
      letter-spacing: 0.4px; opacity: 0; animation: loginTextIn 0.5s ease 0.35s forwards;
    }
    @keyframes loginLogoBlast {
      0% { transform: scale(0.4); opacity: 0; }
      45% { transform: scale(1.25); opacity: 1; }
      70% { transform: scale(0.95); }
      100% { transform: scale(14); opacity: 0; }
    }
    @keyframes loginTextIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }



    /* ─── Page transition animation — replayed every time #page's content
       changes so navigating around the app feels smooth, not jumpy ─── */
    @keyframes pageFadeSlideIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    #page.page-anim { animation: pageFadeSlideIn 0.32s cubic-bezier(0.16,1,0.3,1); }

    #app { display: flex; min-height: 100vh; display: none; }
    #app.show { display: flex; }

    #sidebar {
      width: 250px; background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
      color: #fff; position: fixed; top: 0; bottom: 0; left: 0;
      display: flex; flex-direction: column; z-index: 30; transition: transform 0.25s;
    }
    .brand-row { display: flex; gap: 12px; align-items: center; padding: 22px 18px; border-bottom: 1px solid rgba(255,255,255,0.12); }
    .brand-badge {
      width: 50px; height: 50px; border-radius: 50%; background: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 800;
      color: var(--navy); flex-shrink: 0; font-family: 'Poppins', sans-serif;
      font-size: 14px; letter-spacing: 0.5px; overflow: hidden;
      border: 2px solid var(--gold); box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .brand-badge img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
    .brand small { display: block; font-size: 10px; color: #a9b0d8; letter-spacing: 0.8px; margin-top: 3px; font-weight: 500; }
    .brand strong { font-size: 15px; line-height: 1.2; letter-spacing: 0.3px; display: block; }

    nav.sidenav { flex: 1; padding: 14px 12px; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 11px 14px;
      border-radius: 12px; color: #c7cbea; cursor: pointer; font-size: 14.5px;
      margin-bottom: 3px; transition: background 0.15s, color 0.15s;
    }
    .nav-item i { width: 18px; text-align: center; font-size: 15px; }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-item.active { background: var(--navy-light); color: #fff; font-weight: 600; box-shadow: inset 0 0 0 1px rgba(145, 143, 143, 0.06); }
    .role-employee .nav-item.active { background: var(--orange); }
    .nav-badge { margin-left: auto; background: #e0473c; color: #fff; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 20px; }
    .nav-new { margin-left: auto; background: #3aa65b; color: #fff; font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.4px; }

    .sidebar-foot { padding: 14px; }
    .day-card { background: rgba(255,255,255,0.06); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; }
    .day-card .ic { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
    .day-card .day { font-weight: 700; font-size: 14px; }
    .day-card .date { font-size: 11px; color: #a9b0d8; }
    .day-card .time { margin-left: auto; text-align: right; font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 600; }
    .day-card .ampm { font-size: 10px; color: #a9b0d8; }

    #main { margin-left: 250px; flex: 1; display: flex; flex-direction: column; min-width: 0; }
    header.topbar {
      background: #fff; border-bottom: 1px solid var(--line); padding: 14px 26px;
      display: flex; align-items: center; gap: 20px; position: sticky; top: 0; z-index: 20;
    }
    .menu-toggle { display: none; background: none; border: none; font-size: 18px; color: var(--navy); cursor: pointer; }
    .search-wrap { flex: 1; max-width: 520px; position: relative; }
    .search-wrap input {
      width: 100%; padding: 11px 14px 11px 40px; border-radius: 12px;
      border: 1px solid var(--line); background: #f6f7fb; font-size: 13.5px;
    }
    .search-wrap input:focus { outline: none; border-color: var(--navy-light); background: #fff; box-shadow: 0 0 0 3px rgba(27,42,112,0.08); }
    .search-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9497ac; }

    /* ─── Global search pop-up results ─── */
    .search-results-panel {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 20px 50px rgba(20,25,60,0.18); max-height: 440px; overflow-y: auto;
      z-index: 40; display: none; padding: 6px 0;
    }
    .search-results-panel.show { display: block; }
    .sr-group { padding: 8px 10px; }
    .sr-group + .sr-group { border-top: 1px solid #f2f3f8; }
    .sr-group-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--sub); margin: 4px 8px 6px; }
    .sr-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; cursor: pointer; border-radius: 10px; }
    .sr-item:hover { background: #f6f7fb; }
    .sr-item .sr-ic { width: 30px; height: 30px; border-radius: 8px; background: #eef0f8; color: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
    .sr-item .sr-main { min-width: 0; flex: 1; }
    .sr-item .sr-title { font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sr-item .sr-sub { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sr-empty { padding: 26px 16px; text-align: center; color: var(--sub); font-size: 13px; }

    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
    .bell { position: relative; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #f2f3f8; cursor: pointer; color: var(--navy); font-size: 16px; border: none; }
    .bell .dot { position: absolute; top: 6px; right: 7px; width: 9px; height: 9px; background: var(--red); border-radius: 50%; border: 2px solid #fff; }
    .user-chip { display: flex; align-items: center; gap: 10px; padding-left: 16px; border-left: 1px solid var(--line); cursor: default; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: #e7e9f2; display: flex; align-items: center; justify-content: center; color: #9497ac; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .user-chip .who { line-height: 1.2; text-align: right; }
    .user-chip .name { font-weight: 700; font-size: 13.5px; }
    .user-chip .role { font-size: 11px; color: var(--sub); }
    .logout-btn { background: none; border: none; color: var(--red); font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: background 0.15s; }
    .logout-btn:hover { background: #fde7e6; }

    #page { padding: 26px; flex: 1; }

    #notifPanel {
      position: fixed; top: 70px; right: 26px; width: 330px; background: #fff;
      border-radius: 16px; box-shadow: 0 20px 50px rgba(20,25,60,0.2);
      border: 1px solid var(--line); z-index: 50; display: none; overflow: hidden;
    }
    #notifPanel.show { display: block; }
    .notif-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .notif-head button { background: none; border: none; color: #9497ac; cursor: pointer; font-size: 15px; }
    .notif-item { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #f2f3f8; cursor: default; }
    .notif-item:hover { background: #f9f9fc; }
    .notif-item .ic { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; }
    .notif-item p { margin: 0; font-size: 13px; font-weight: 600; }
    .notif-item span { font-size: 11px; color: var(--sub); }

    .page-title { font-size: 24px; font-weight: 800; margin: 0 0 4px; }
    .page-sub { color: var(--sub); font-size: 14px; margin: 0 0 22px; }
    .breadcrumb { font-size: 12px; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
    .breadcrumb i { font-size: 8px; margin: 0 5px; color: #c9cce0; }
    .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 18px; display: flex; flex-direction: column; gap: 10px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(162, 162, 167, 0.08); }
    .stat-top { display: flex; align-items: center; gap: 12px; }
    .stat-ic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; flex-shrink: 0; }
    .stat-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; color: var(--sub); text-transform: uppercase; }
    .stat-num { font-size: 30px; font-weight: 800; font-family: 'Poppins', sans-serif; }
    .stat-link { font-size: 12.5px; color: var(--navy-light); font-weight: 600; text-decoration: none; cursor: pointer; }
    .role-employee .stat-link { color: var(--orange); }

    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; align-items: start; }
    @media (max-width: 980px) { .two-col { grid-template-columns: 1fr; } }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .panel-head h3 { margin: 0; font-size: 16px; }
    .view-all { font-size: 12.5px; color: var(--navy-light); font-weight: 600; cursor: pointer; }
    .role-employee .view-all { color: var(--orange); }

    .activity-row, .qa-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid #f2f3f8; }
    .activity-row:last-child { border-bottom: none; }
    .activity-ic { width: 34px; height: 34px; border-radius: 50%; background: #f2f3f8; display: flex; align-items: center; justify-content: center; color: var(--navy); flex-shrink: 0; }
    .activity-row p { margin: 0; font-size: 13.5px; font-weight: 600; }
    .announcement-old { opacity: 0.72; }
    .announcement-old-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: #9497ac; background: #eef0f4; padding: 2px 8px; border-radius: 20px; margin-left: 8px; vertical-align: middle; }
    .activity-row span { font-size: 11.5px; color: var(--sub); }

    .qa-btn {
      display: flex; align-items: center; gap: 10px; padding: 13px 14px;
      border-radius: 12px; background: #f6f7fb; border: 1px solid var(--line);

    // ═══ PHILIPPINE TIME — synced from the server, ignores the laptop's clock ═══
const PH_TZ = 'Asia/Manila';
const phClock = { baseMs: Date.now(), basePerf: performance.now() };

// performance.now() is a monotonic timer: changing the laptop date/time does not affect it
function phNowMs() { return phClock.baseMs + (performance.now() - phClock.basePerf); }

async function syncPhTime() {
  try {
    const t0 = performance.now();
    const data = await fetch(`${API_BASE_URL}/time`, { cache: 'no-store' }).then(r => r.json());
    const t1 = performance.now();
    if (!data || !data.serverMs) return;
    phClock.baseMs = data.serverMs + (t1 - t0) / 2;
    phClock.basePerf = t1;
  } catch (e) { /* keep last known time */ }
}

const _phFmt = new Intl.DateTimeFormat('en-US', {
  timeZone: PH_TZ, weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',
  hour: 'numeric', minute: '2-digit', hour12: true
});
const _phDateFmt = new Intl.DateTimeFormat('en-CA', { timeZone: PH_TZ, year: 'numeric', month: '2-digit', day: '2-digit' });

function phParts() {
  const p = {};
  _phFmt.formatToParts(new Date(phNowMs())).forEach(x => { p[x.type] = x.value; });
  return p;
}
function phDateKey() { return _phDateFmt.format(new Date(phNowMs())); } // YYYY-MM-DD (Philippine date)
function todayStr() { return phDateKey(); }

const _phSecFmt = new Intl.DateTimeFormat('en-US', {
  timeZone: PH_TZ, hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
});
const _phShortDateFmt = new Intl.DateTimeFormat('en-US', {
  timeZone: PH_TZ, weekday: 'long', month: 'long', day: 'numeric'
});

function tickSidebarQuickClock() {
  const clockEl = document.getElementById('sbClock');
  if (!clockEl) return;
  const d = new Date(phNowMs());
  const p = {};
  _phSecFmt.formatToParts(d).forEach(x => { p[x.type] = x.value; });
  clockEl.textContent = `${p.hour}:${p.minute}:${p.second}`;
  document.getElementById('sbAmpm').textContent = p.dayPeriod;
  document.getElementById('sbDate').textContent = _phShortDateFmt.format(d);
}

function tickClock() {
  const p = phParts();
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  const dateText = `${p.month} ${p.day}, ${p.year}`;
  const timeText = `${p.hour}:${p.minute}`;
  // sidebar (portal)

    // ─── Global search: looks across every part of the HR admin page
    // (employees, departments, leave, complaints, announcements,
    // reports/evaluations, separated) and shows a clickable pop-up of
    // matches, instead of just filtering the Employees table. ───
    function buildSearchIndex(query) {
      const q = query.trim().toLowerCase();
      if (!q) return null;
      const res = { employees: [], departments: [], leave: [], complaints: [], announcements: [], reports: [], separated: [] };

      employees.forEach(e => {
        const hay = `${e.first} ${e.last} ${e.id} ${e.position} ${e.department}`.toLowerCase();
        if (hay.includes(q)) res.employees.push(e);
      });
      departments.forEach(d => {
        if ((d.name || '').toLowerCase().includes(q)) res.departments.push(d);
      });
      leaveRequests.forEach(l => {
        const hay = `${l.name} ${l.dept} ${l.type}`.toLowerCase();
        if (hay.includes(q)) res.leave.push(l);
      });
      complaints.forEach(c => {
        const hay = `${c.subject} ${c.employee}`.toLowerCase();
        if (hay.includes(q)) res.complaints.push(c);
      });
      announcements.forEach(a => {
        if ((a.title || '').toLowerCase().includes(q)) res.announcements.push(a);
      });
      reports.forEach(r => {
        const hay = `${r.employeeName} ${r.period} ${r.department}`.toLowerCase();
        if (hay.includes(q)) res.reports.push(r);
      });
      separated.forEach(e => {
        const hay = `${e.first} ${e.last} ${e.id} ${e.position} ${e.department}`.toLowerCase();
        if (hay.includes(q)) res.separated.push(e);
      });
      return res;
    }

      if (!totalCount) {

      const d = (e.department || '').toLowerCase();

      if (e.department === 'Unassigned') return null;
      if (EMPLOYEE_BOX_OVERRIDE[e.id]) return EMPLOYEE_BOX_OVERRIDE[e.id].box;

      return DEPT_TO_BOX[e.department] || null;

    // Quickly duplicate an existing employee's role/department/salary/type

    window.duplicateEmployee = function(id) {
      const e = employees.find(x => x.id === id);
      if (!e) return;
      goTo('addEmployee');
      const setVal = (elId, val) => { const el = document.getElementById(elId); if (el) el.value = val || ''; };
      setVal('f_position', e.position);
      setVal('f_department', e.department);
      setVal('f_salary', e.salary);
      setVal('f_type', e.type || 'Regular');
      setVal('f_gender', e.gender || 'Female');
      setVal('f_status', 'Active');
      setVal('f_duties', e.duties || getPositionDuties(e));
      showToast(`Copied details from ${e.first} ${e.last} — just fill in the new employee's name & ID`);

    function prefillAddEmployeeDept(deptName) {
      goTo('addEmployee');

        const found = Array.from(sel.options).some(o => o.value === deptName);
        if (!found) {
          const opt = document.createElement('option');
          opt.value = deptName; opt.textContent = deptName;
          sel.appendChild(opt);
        }
        sel.value = deptName;
      });
      showToast(`Add the new employee — department pre-set to ${deptName}`);
    }

      window.saveEditEmployee = async function(id) {
  const e = employees.find(x => x.id === id);
  if (!e) return;
  const payload = {
    first: document.getElementById('e_first').value.trim() || e.first,
    last: document.getElementById('e_last').value.trim() || e.last,
    position: document.getElementById('e_position').value.trim() || e.position,
    department: document.getElementById('e_department').value,
    status: document.getElementById('e_status').value,
    salary: document.getElementById('e_salary').value.trim(),
    email: document.getElementById('e_email').value.trim(),
    phone: document.getElementById('e_phone').value.trim(),
    sss: document.getElementById('e_sss').value.trim(),
    philhealth: document.getElementById('e_philhealth').value.trim(),
    pagibig: document.getElementById('e_pagibig').value.trim(),
    pin: document.getElementById('e_pin').value.trim(),
    duties: document.getElementById('e_duties').value.trim()
  };
  const newPassword = document.getElementById('e_password').value.trim();
  try {
    await fetch(`${API_BASE_URL}/employees/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    let pwFailed = false, pwMsg = '', loginEmail = payload.email;
    if (newPassword) {
      const pwRes = await fetch(`${API_BASE_URL}/employees/${id}/password`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: newPassword })
      });
      let pwData = {};
      try { pwData = await pwRes.json(); } catch (err) {}
      if (!pwRes.ok) { pwFailed = true; pwMsg = pwData.error || 'password reset failed'; }
      else if (pwData.loginEmail) loginEmail = pwData.loginEmail;
    }

    await reloadAndRender();
    closeModal();

    if (pwFailed) showToast('Employee saved, but ' + pwMsg, 'fa-triangle-exclamation');
    else if (newPassword) showToast('Password reset! Login email: ' + loginEmail);
    else showToast('Employee updated!');
  } catch (err) {
    showToast('Failed to update employee', 'fa-triangle-exclamation');
  }
};

    // A single, user-friendly aggregate card representing every non-teaching
    // / support employee (Facilities, Maintenance, etc.) — instead of a
    // separate card per real backend department record. Sits right beside
    // the academic college cards, not in its own section.
    function nonTeachingBoxData() {
      const academicNames = departments.filter(d => d.group === 'academic').map(d => d.name);
      const staff = employees.filter(e => e.department !== 'Unassigned' && !academicNames.includes(e.department));
      const headEmp = staff.find(e => (e.position || '').toLowerCase().includes('head'));
      return {
        name: NON_TEACHING_KEY,
        isSynthetic: true,
        displayName: 'Non-Teaching',
        detail: 'Maintenance, custodial, and other support staff across the college.',
        count: staff.length,
        headName: headEmp ? `${headEmp.first} ${headEmp.last}` : null,
        staff
      };
    }

    // Falls back to whoever holds a "head" position in that department
    // (e.g. "Maintenance Head") when no head has been formally assigned,
    // so cards are self-explanatory at a glance instead of just saying
    // "Not Assigned".
    function getDeptDisplayHead(d) {
      if (d.head && d.head !== 'Not Assigned') return d.head;
      const headEmp = employees.find(e => e.department === d.name && (e.position || '').toLowerCase().includes('head'));
      return headEmp ? `${headEmp.first} ${headEmp.last}` : null;
    }

        // ═══════════════════════════════════════════════════════════
    //  IMPORT BIOMETRIC LOG PHOTO — keeps the photo, reads ALL
    //  employee info on it, fills attendance for matched employees
    // ═══════════════════════════════════════════════════════════
    window._bioFile = null;
    window._bioRows = [];
    window._bioRaw = '';
    window._bioThumb = '';

    function escBio(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // Shrinks the photo before saving so it uploads fast and stays small
    function resizeImageToDataURL(file, maxW = 1400, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    // "8:03", "8:03am", "17:45" → "8:03 AM" / "5:45 PM"
    function normalizeBioTime(str) {
      const m = String(str || '').trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp])?\.?[Mm]?\.?$/);
      if (!m) return null;
      let h = parseInt(m[1], 10);
      const min = m[2];
      if (h > 23 || parseInt(min, 10) > 59) return null;
      let ampm;
      if (m[3]) {
        ampm = m[3].toUpperCase() === 'P' ? 'PM' : 'AM';
        if (h > 12 || h === 0) return null;
      } else {
        ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
      }
      return `${h}:${min} ${ampm}`;
    }

    function bioTimeToMinutes(t) {
      const m = t.match(/^(\d{1,2}):(\d{2}) (AM|PM)$/);
      let h = parseInt(m[1], 10);
      if (m[3] === 'PM' && h !== 12) h += 12;
      if (m[3] === 'AM' && h === 12) h = 0;
      return h * 60 + parseInt(m[2], 10);
    }

    function bioStatusPreview(tinRaw, toutRaw) {
      const tin = normalizeBioTime(tinRaw), tout = normalizeBioTime(toutRaw);
      let s = '';
      if (tin) s = bioTimeToMinutes(tin) > 8 * 60 ? 'Late' : 'Present';
      if (tout && bioTimeToMinutes(tout) < 18 * 60) s = 'Undertime';
      return s;
    }

    function extractBioDate(line) {
      let m = line.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
      if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      m = line.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
      if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
      return null;
    }

    function matchEmployeeInBioLine(line) {
      const lineName = ' ' + line.toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ') + ' ';
      const lineId = line.toUpperCase().replace(/[^A-Z0-9]/g, '');
      return employees.filter(e => e.status !== 'Inactive').find(e => {
        const idNorm = String(e.id || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (idNorm && lineId.includes(idNorm)) return true;
        const first = (e.first || '').toLowerCase().trim();
        const last = (e.last || '').toLowerCase().trim();
        return first && last && lineName.includes(' ' + first) && lineName.includes(last);
      }) || null;
    }

    function timesInLine(line) {
      const out = [];
      const re = /(\d{1,2}:\d{2}(?::\d{2})?\s*(?:[AaPp][Mm])?)/g;
      let m;
      while ((m = re.exec(line)) !== null) {
        const t = normalizeBioTime(m[1]);
        if (t) out.push(t);
      }
      return out;
    }

    function pickInOut(times) {
      const t = [...new Set(times)].sort((a, b) => bioTimeToMinutes(a) - bioTimeToMinutes(b));
      let timeIn = '', timeOut = '';
      if (t.length >= 2) { timeIn = t[0]; timeOut = t[t.length - 1]; }
      else if (t.length === 1) { if (bioTimeToMinutes(t[0]) < 12 * 60) timeIn = t[0]; else timeOut = t[0]; }
      return { timeIn, timeOut };
    }

    function parseBiometricText(text, defaultDate) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const textDate = extractBioDate(text);
      const groups = {};   // matched employees: "empId|date"
      const unmatched = []; // lines with a time but no employee on file
      lines.forEach(line => {
        const emp = matchEmployeeInBioLine(line);
        const date = extractBioDate(line) || textDate || defaultDate;
        if (emp) {
          const key = emp.id + '|' + date;
          if (!groups[key]) groups[key] = { emp, date, times: [] };
          groups[key].times.push(...timesInLine(line));
        } else {
          const times = timesInLine(line);
          if (times.length) unmatched.push({ line, date, times });
        }
      });

      const rows = Object.values(groups).map(g => {
        const { timeIn, timeOut } = pickInOut(g.times);
        return {
          include: !!(timeIn || timeOut), unmatched: false,
          employeeId: g.emp.id, name: `${g.emp.first} ${g.emp.last}`, department: g.emp.department, position: g.emp.position,
          date: g.date, timeIn, timeOut, rawLine: ''
        };
      });
      unmatched.forEach(u => {
        const { timeIn, timeOut } = pickInOut(u.times);
        rows.push({
          include: false, unmatched: true,
          employeeId: '', name: '', department: '', position: '',
          date: u.date, timeIn, timeOut, rawLine: u.line
        });
      });
      return rows;
    }

    window.handleBioFile = async function(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { showToast('Please choose an image file', 'fa-triangle-exclamation'); return; }
      window._bioFile = file;
      try { window._bioThumb = await resizeImageToDataURL(file); } catch (e) { window._bioThumb = ''; }
      const img = document.getElementById('bp_preview');
      img.src = window._bioThumb || URL.createObjectURL(file);
      img.style.display = 'block';
    };

    window.runBiometricOCR = async function() {
      const statusEl = document.getElementById('bp_status');
      if (!window._bioFile) { showToast('Please choose a biometric photo first', 'fa-triangle-exclamation'); return; }
      if (typeof Tesseract === 'undefined') { showToast('Photo reader failed to load. Check your internet connection.', 'fa-triangle-exclamation'); return; }
      statusEl.textContent = 'Reading photo… 0%';
      try {
        const result = await Tesseract.recognize(window._bioFile, 'eng', {
          logger: m => { if (m.status === 'recognizing text') statusEl.textContent = 'Reading photo… ' + Math.round(m.progress * 100) + '%'; }
        });
        window._bioRaw = result.data.text || '';
        const defaultDate = document.getElementById('bp_date').value || todayStr();
        window._bioRows = parseBiometricText(window._bioRaw, defaultDate);
        const matched = window._bioRows.filter(r => !r.unmatched).length;
        const unm = window._bioRows.length - matched;
        statusEl.textContent = window._bioRows.length
          ? `Found ${matched} employee(s) on file` + (unm ? ` and ${unm} line(s) not matched — choose the employee for those.` : '.') + ' Check the times, then save.'
          : 'Nothing readable found. Try a clearer, straighter photo.';
        renderBioRows();
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Could not read the photo. Please try again.';
      }
    };

    window.assignBioRow = function(i, empId) {
      const e = employees.find(x => x.id === empId);
      const r = window._bioRows[i];
      if (!r) return;
      if (e) {
        r.employeeId = e.id; r.name = `${e.first} ${e.last}`; r.department = e.department; r.position = e.position;
        r.unmatched = false; r.include = !!(r.timeIn || r.timeOut);
      } else {
        r.employeeId = ''; r.name = ''; r.department = ''; r.position = ''; r.unmatched = true; r.include = false;
      }
      renderBioRows();
    };

    function renderBioRows() {
      const box = document.getElementById('bp_results');
      if (!box) return;
      const rows = window._bioRows;
      if (!rows.length) { box.innerHTML = ''; return; }
      const inp = 'width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#f6f7fb;font-size:12.5px;font-family:inherit;';
      const empOptions = employees.filter(e => e.status !== 'Inactive')

          <table>
            <thead><tr><th></th><th>Employee</th><th>Date</th><th>Time In</th><th>Time Out</th><th>Status</th></tr></thead>
            <tbody>
              ${rows.map((r, i) => `
                <tr>
                  <td><input type="checkbox" ${r.include ? 'checked' : ''} ${r.unmatched ? 'disabled' : ''} onchange="_bioRows[${i}].include=this.checked" /></td>
                  <td style="min-width:190px;">
                    ${r.unmatched ? `
                      <select style="${inp}" onchange="assignBioRow(${i}, this.value)"><option value="">Not on file — choose employee</option>${empOptions}</select>
                      <div style="font-size:10.5px;color:var(--sub);margin-top:3px;">Read: ${escBio(r.rawLine)}</div>
                    ` : `
                      <strong>${escBio(r.name)}</strong>
                      <div style="font-size:11px;color:var(--sub);">${escBio(r.employeeId)} · ${escBio(r.position)} · ${escBio(r.department)}</div>
                    `}
                  </td>
                  <td><input type="date" value="${r.date}" style="${inp}" onchange="_bioRows[${i}].date=this.value" /></td>
                  <td><input type="text" value="${escBio(r.timeIn)}" placeholder="8:03 AM" style="${inp}" oninput="_bioRows[${i}].timeIn=this.value" /></td>
                  <td><input type="text" value="${escBio(r.timeOut)}" placeholder="5:47 PM" style="${inp}" oninput="_bioRows[${i}].timeOut=this.value" /></td>
                  <td>${(() => { const s = bioStatusPreview(r.timeIn, r.timeOut); return s ? `<span class="pill ${s==='Present'?'pill-active':(s==='Late'?'pill-leave':'pill-undertime')}">${s}</span>` : '-'; })()}</td>

        </details>
        <button class="btn btn-navy" style="width:100%;margin-top:14px;" onclick="saveBiometricPhotoRows()"><i class="fas fa-check"></i> Save Photo &amp; Import to Attendance</button>
      `;

    window.saveBiometricPhotoRows = async function() {
      const rows = [];
      for (const r of window._bioRows) {
        const tin = r.timeIn ? normalizeBioTime(r.timeIn) : '';
        const tout = r.timeOut ? normalizeBioTime(r.timeOut) : '';
        if (r.include && ((r.timeIn && !tin) || (r.timeOut && !tout))) {
          showToast(`Fix the time format for ${r.name || 'a row'} (example: 8:03 AM)`, 'fa-triangle-exclamation');
          return;
        }
        rows.push({ ...r, timeIn: tin || '', timeOut: tout || '' });

      if (!rows.some(r => r.include && r.employeeId)) { showToast('Select at least one employee to import', 'fa-triangle-exclamation'); return; }
      try {
        const res = await fetch(`${API_BASE_URL}/attendance/biometric-import`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fileName: window._bioFile ? window._bioFile.name : 'biometric-photo',
            image: window._bioThumb,
            rawText: window._bioRaw,
            importedBy: currentUser.name,
            rows
          })
        });

        showToast('Failed to import biometric photo', 'fa-triangle-exclamation');
      }
    };

    window.handleBioFile = function(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { showToast('Please choose an image file', 'fa-triangle-exclamation'); return; }
      window._bioFile = file;
      const img = document.getElementById('bp_preview');
      img.src = URL.createObjectURL(file);
      img.style.display = 'block';
    };

    // "8:03", "8:03am", "17:45" → "8:03 AM" / "5:45 PM"
    function normalizeBioTime(str) {
      const m = String(str || '').trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp])?\.?[Mm]?\.?$/);
      if (!m) return null;
      let h = parseInt(m[1], 10);
      const min = m[2];
      if (h > 23 || parseInt(min, 10) > 59) return null;
      let ampm;
      if (m[3]) {
        ampm = m[3].toUpperCase() === 'P' ? 'PM' : 'AM';
        if (h > 12 || h === 0) return null;
      } else {
        ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
      }
      return `${h}:${min} ${ampm}`;
    }

    function bioTimeToMinutes(t) {
      const m = t.match(/^(\d{1,2}):(\d{2}) (AM|PM)$/);
      let h = parseInt(m[1], 10);
      if (m[3] === 'PM' && h !== 12) h += 12;
      if (m[3] === 'AM' && h === 12) h = 0;
      return h * 60 + parseInt(m[2], 10);
    }

    function extractBioDate(line) {
      let m = line.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
      if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
      m = line.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/); // MM/DD/YYYY
      if (m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
      return null;
    }

    function matchEmployeeInBioLine(line) {
      const lineName = ' ' + line.toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ') + ' ';
      const lineId = line.toUpperCase().replace(/[^A-Z0-9]/g, '');
      return employees.filter(e => e.status !== 'Inactive').find(e => {
        const idNorm = String(e.id || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (idNorm && lineId.includes(idNorm)) return true;
        const first = (e.first || '').toLowerCase().trim();
        const last = (e.last || '').toLowerCase().trim();
        return first && last && lineName.includes(' ' + first) && lineName.includes(last);
      }) || null;
    }

    function parseBiometricText(text, defaultDate) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const textDate = extractBioDate(text);
      const groups = {}; // "empId|date" -> { emp, date, times[] }
      lines.forEach(line => {
        const emp = matchEmployeeInBioLine(line);
        if (!emp) return;
        const date = extractBioDate(line) || textDate || defaultDate;
        const key = emp.id + '|' + date;
        if (!groups[key]) groups[key] = { emp, date, times: [] };
        const re = /(\d{1,2}:\d{2}(?::\d{2})?\s*(?:[AaPp][Mm])?)/g;
        let m;
        while ((m = re.exec(line)) !== null) {
          const t = normalizeBioTime(m[1]);
          if (t) groups[key].times.push(t);
        }
      });
      return Object.values(groups).map(g => {
        const times = [...new Set(g.times)].sort((a, b) => bioTimeToMinutes(a) - bioTimeToMinutes(b));
        let timeIn = '', timeOut = '';
        if (times.length >= 2) { timeIn = times[0]; timeOut = times[times.length - 1]; }
        else if (times.length === 1) { if (bioTimeToMinutes(times[0]) < 12 * 60) timeIn = times[0]; else timeOut = times[0]; }
        return { include: !!(timeIn || timeOut), employeeId: g.emp.id, name: `${g.emp.first} ${g.emp.last}`, department: g.emp.department, date: g.date, timeIn, timeOut };
      });
    }

    window.runBiometricOCR = async function() {
      const statusEl = document.getElementById('bp_status');
      if (!window._bioFile) { showToast('Please choose a biometric photo first', 'fa-triangle-exclamation'); return; }
      if (typeof Tesseract === 'undefined') { showToast('Photo reader failed to load. Check your internet connection.', 'fa-triangle-exclamation'); return; }
      statusEl.textContent = 'Reading photo… 0%';
      try {
        const result = await Tesseract.recognize(window._bioFile, 'eng', {
          logger: m => { if (m.status === 'recognizing text') statusEl.textContent = 'Reading photo… ' + Math.round(m.progress * 100) + '%'; }
        });
        const defaultDate = document.getElementById('bp_date').value || todayStr();
        window._bioRows = parseBiometricText(result.data.text, defaultDate);
        statusEl.textContent = window._bioRows.length
          ? `Found ${window._bioRows.length} employee(s) in the photo. Check the times below, fix anything wrong, then save.`
          : 'No employees matched. Try a clearer, straighter photo (names or Employee IDs must be visible).';
        renderBioRows();
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Could not read the photo. Please try again.';
      }
    };

    function renderBioRows() {
      const box = document.getElementById('bp_results');
      if (!box) return;
      if (!window._bioRows.length) { box.innerHTML = ''; return; }
      const inp = 'width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#f6f7fb;font-size:12.5px;font-family:inherit;';
      box.innerHTML = `

                  <td><strong>${r.name}</strong><div style="font-size:11px;color:var(--sub);">${r.employeeId} · ${r.department}</div></td>
                  <td><input type="date" value="${r.date}" style="${inp}" onchange="_bioRows[${i}].date=this.value" /></td>
                  <td><input type="text" value="${r.timeIn}" placeholder="8:03 AM" style="${inp}" oninput="_bioRows[${i}].timeIn=this.value" /></td>
                  <td><input type="text" value="${r.timeOut}" placeholder="5:47 PM" style="${inp}" oninput="_bioRows[${i}].timeOut=this.value" /></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>

    window.saveBiometricPhotoRows = async function() {
  if (!window._bioFile) { showToast('Please choose a photo first', 'fa-triangle-exclamation'); return; }
  if (!window._bioThumb) { showToast('This photo could not be processed. Try a JPG or PNG.', 'fa-triangle-exclamation'); return; }
  const assignedTo = Array.from(document.querySelectorAll('.bp_emp:checked')).map(c => c.value);
  const rows = [];
  for (const r of window._bioRows) {
    const tin = r.timeIn ? normalizeBioTime(r.timeIn) : '';
    const tout = r.timeOut ? normalizeBioTime(r.timeOut) : '';
    if (r.include && ((r.timeIn && !tin) || (r.timeOut && !tout))) {
      showToast(`Fix the time format for ${r.name || 'a row'} (example: 8:03 AM)`, 'fa-triangle-exclamation');
      return;
    }
    rows.push({ ...r, timeIn: tin || '', timeOut: tout || '' });
  }
  const hasRows = rows.some(r => r.include && r.employeeId);
  if (!hasRows && !assignedTo.length) {
    showToast('Tick at least one employee, or read the photo first', 'fa-triangle-exclamation');
    return;
  }
  try {
    const res = await fetch(`${API_BASE_URL}/attendance/biometric-import`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fileName: window._bioFile.name,
        image: window._bioThumb,
        rawText: window._bioRaw,
        importedBy: currentUser.name,
        assignedTo,
        rows
      })
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Failed to attach photo', 'fa-triangle-exclamation'); return; }
    closeModal();
    await goTo('attendance');
    showToast(hasRows ? `Photo attached — ${data.saved} employee(s) updated` : `Photo attached to ${assignedTo.length} employee(s)`);
  } catch (err) {
    showToast('Failed to attach photo', 'fa-triangle-exclamation');
  }
};

    window.exportAttendanceCSV = function() {
      const date = todayStr();
      const rows = attendanceLogs.filter(l => l.date === date);

      rows.forEach(l => { csv += `"${l.name}","${l.department}","${l.timeIn || ''}","${l.timeOut || ''}","${l.status}"\n`; });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `attendance_${date}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Attendance exported');
    };

        // ─── Portal password helpers (8–16 chars, letters + numbers) ───
    function generatePortalPassword(len = 8) {
      const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz';
      const digits = '23456789';
      const all = letters + digits;
      const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
      const chars = [letters[rnd(letters.length)], digits[rnd(digits.length)]]; // at least 1 letter + 1 number
      while (chars.length < len) chars.push(all[rnd(all.length)]);
      for (let i = chars.length - 1; i > 0; i--) {           // shuffle
        const j = rnd(i + 1);
        [chars[i], chars[j]] = [chars[j], chars[i]];
      }
      return chars.join('');
    }

    // MongoDB ObjectIds encode their creation time in the first 4 bytes —
    // use that to tell which calendar month an announcement was posted in,
    // since we don't store a separate date field.
    function getAnnouncementDate(a) {
      if (a && a._id && typeof a._id === 'string' && a._id.length >= 8) {
        const seconds = parseInt(a._id.substring(0, 8), 16);
        if (!isNaN(seconds)) return new Date(seconds * 1000);
      }
      return null;
    }

    // "YYYY-MM" key for the calendar month an announcement was posted in.
    function getAnnouncementMonthKey(a) {
      const d = getAnnouncementDate(a);
      if (!d) return null;
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function getAnnouncementMonthLabel(key) {
      const [y, m] = key.split('-').map(Number);
      return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    function getCurrentMonthKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    // An announcement is "past" once its calendar month is no longer the
    // current one — that's when it moves into the Archive.
    function isAnnouncementOld(a) {
      const key = getAnnouncementMonthKey(a);
      if (!key) return false;
      return key !== getCurrentMonthKey();
    }

    function buildYearMonthBuckets(year, countsByKey) {
      const buckets = [];
      for (let m = 1; m <= 12; m++) {
        const key = `${year}-${String(m).padStart(2, '0')}`;
        buckets.push({ key, label: new Date(year, m - 1, 1).toLocaleDateString('en-US', { month: 'long' }), count: countsByKey[key] || 0 });
      }
      return buckets;
    }
    function getMonthLabel(key) { return getAnnouncementMonthLabel(key); }

    function getAnnouncementMonthBuckets() {
      const counts = {};
      const currentKey = getCurrentMonthKey();
      announcements.forEach(a => {
        const key = getAnnouncementMonthKey(a);
        if (key && key !== currentKey) counts[key] = (counts[key] || 0) + 1;
      });
      const year = new Date().getFullYear();
      return buildYearMonthBuckets(year, counts).filter(b => b.key !== currentKey && b.count > 0);
    }

      const bal = e.leaveBalance !== undefined ? e.leaveBalance : 0;
      const today = todayStr();
      openModal(`

            <h2 style="margin-top:0;">File Leave Request</h2>

            <div class="error-msg" id="leaveReqError"></div>

            </div>
            <div class="field"><label>Reason</label><input id="leave_reason" type="text" placeholder="Briefly describe your reason" /></div>
            <button class="btn btn-navy" style="width:100%;margin-top:12px;" onclick="submitLeaveRequest()">Submit Request</button>
          `);
    };

    window.submitLeaveRequest = async function() {
      const errEl = document.getElementById('leaveReqError');
      const showLeaveError = (msg) => {
        if (errEl) { errEl.textContent = msg; errEl.classList.add('show'); }
        showToast(msg, 'fa-triangle-exclamation');
      };
      if (errEl) { errEl.classList.remove('show'); errEl.textContent = ''; }

      const type = document.getElementById('leave_type').value;
      const start = document.getElementById('leave_start').value;
      const end = document.getElementById('leave_end').value;
      const reason = document.getElementById('leave_reason').value.trim();

      if (!start || !end) { showLeaveError('Please select start and end dates'); return; }
      if (new Date(start) > new Date(end)) { showLeaveError('End date must be after start date'); return; }

      const e = getCurrentEmployee();
      if (!e) { showLeaveError('Employee record not found. Please log in again.'); return; }
      const daysRequested = Math.ceil((new Date(end) - new Date(start)) / (1000 * 60 * 60 * 24)) + 1;
      const bal = e.leaveBalance !== undefined ? e.leaveBalance : 0;
      if (bal < daysRequested) { showLeaveError('Insufficient leave balance. You have ' + bal + ' day(s) left.'); return; }

      const startFmt = new Date(start).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
      const endFmt = new Date(end).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
      const dates = startFmt + ' - ' + endFmt;

      try {
        const res = await fetch(`${API_BASE_URL}/leave-requests/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: currentUser.name,
            email: e.email || currentUser.email,
            dept: e.department,
            type,
            dates,
            startDate: start,
            endDate: end,
            reason,
            status: 'Pending',
            dateFiled: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
          })
        });
        const data = await res.json();
        if (!res.ok) { showLeaveError(data.error || 'Failed to submit leave request.'); return; }
        if (data.data && data.data._id) selectedLeaveRequestId = data.data._id;
        await reloadAndRender();
        closeModal();
        showToast('Leave request submitted! Remaining: ' + (data.remainingBalance !== undefined ? data.remainingBalance : (bal - daysRequested)) + ' day(s)');
        requestAnimationFrame(() => {
          const panel = document.getElementById('leaveTrackerPanel');
          if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
      } catch (err) {
        showLeaveError('Failed to submit leave request. Please check your internet connection.');
      }
    };

    async function loadMyAttendance(monthKey) {
  const e = getCurrentEmployee();
  if (!e) return;
  const currentKey = todayStr().slice(0, 7);
  myAttendanceMonth = monthKey || currentKey;
  try {
    const counts = await fetch(`${API_BASE_URL}/attendance/employee/${encodeURIComponent(e.id)}/months`).then(r => r.json());
    if (counts[currentKey] === undefined) counts[currentKey] = 0;
    myAttendanceBuckets = Object.keys(counts).sort().reverse().map(key => {
      const [y, m] = key.split('-').map(Number);
      return { key, year: y, label: new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long' }), count: counts[key] };
    });
    myAttendanceLogs = await fetch(`${API_BASE_URL}/attendance/employee/${encodeURIComponent(e.id)}/${myAttendanceMonth}`).then(r => r.json());
  } catch (err) {
    myAttendanceBuckets = []; myAttendanceLogs = [];
    showToast('Failed to load attendance history', 'fa-triangle-exclamation');
  }
}

        function attendanceReportBodyHTML() {

    window.saveReportEdit = async function(id) {
      const payload = {
        employeeId: document.getElementById('rep_emp').value,
        employeeName: employees.find(e => e.id === document.getElementById('rep_emp').value)?.first + ' ' + employees.find(e => e.id === document.getElementById('rep_emp').value)?.last,
        department: employees.find(e => e.id === document.getElementById('rep_emp').value)?.department,
        period: document.getElementById('rep_period').value,
        evaluationDate: document.getElementById('rep_date').value,
        overallRating: parseInt(document.getElementById('rep_rating').value) || 1,
        evaluator: document.getElementById('rep_evaluator').value,
        strengths: document.getElementById('rep_strengths').value,
        improvements: document.getElementById('rep_improvements').value,
        goals: document.getElementById('rep_goals').value,
        status: document.getElementById('rep_status').value
      };
      try {
        await fetch(`${API_BASE_URL}/reports/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        await reloadAndRender();
        closeModal();
        showToast('Report updated successfully!');
      } catch (err) {
        showToast('Failed to update report', 'fa-triangle-exclamation');

window.handleBioFile = async function(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Please choose an image file', 'fa-triangle-exclamation'); return; }
  window._bioFile = file;
  window._bioThumb = '';
  try {
    window._bioThumb = await resizeImageToDataURL(file);
  } catch (e) {
    // fallback: use the original file if it is small enough
    if (file.size < 4 * 1024 * 1024) {
      window._bioThumb = await new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(fr.result);
        fr.onerror = reject;
        fr.readAsDataURL(file);
      });
    }
  }
  const img = document.getElementById('bp_preview');
  if (img) {
    img.src = window._bioThumb || URL.createObjectURL(file);
    img.style.display = 'block';
  }
  if (!window._bioThumb) showToast('Could not process this image. Try a JPG or PNG under 4 MB.', 'fa-triangle-exclamation');
};

function parseBiometricText(text, defaultDate) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const textDate = extractBioDate(text);
  const groups = {};
  const unmatched = [];
  lines.forEach(line => {
    const emp = matchEmployeeInBioLine(line);
    const date = extractBioDate(line) || textDate || defaultDate;
    if (emp) {
      const key = emp.id + '|' + date;
      if (!groups[key]) groups[key] = { emp, date, times: [] };
      groups[key].times.push(...timesInLine(line));
    } else {
      const times = timesInLine(line);
      if (times.length) unmatched.push({ line, date, times });
    }
  });
  const rows = Object.values(groups).map(g => {
    const { timeIn, timeOut } = pickInOut(g.times);
    return {
      include: !!(timeIn || timeOut), unmatched: false,
      employeeId: g.emp.id, name: `${g.emp.first} ${g.emp.last}`, department: g.emp.department, position: g.emp.position,
      date: g.date, timeIn, timeOut, rawLine: ''
    };
  });
  unmatched.forEach(u => {
    const { timeIn, timeOut } = pickInOut(u.times);
    rows.push({ include: false, unmatched: true, employeeId: '', name: '', department: '', position: '', date: u.date, timeIn, timeOut, rawLine: u.line });
  });
  return rows;
}

window.runBiometricOCR = async function() {
  const statusEl = document.getElementById('bp_status');
  if (!window._bioFile) { showToast('Please choose a photo first', 'fa-triangle-exclamation'); return; }
  if (typeof Tesseract === 'undefined') { showToast('Photo reader failed to load. Check your internet connection.', 'fa-triangle-exclamation'); return; }
  statusEl.textContent = 'Reading photo… 0%';
  try {
    const result = await Tesseract.recognize(window._bioFile, 'eng', {
      logger: m => { if (m.status === 'recognizing text') statusEl.textContent = 'Reading photo… ' + Math.round(m.progress * 100) + '%'; }
    });
    window._bioRaw = result.data.text || '';
    const defaultDate = document.getElementById('bp_date').value || todayStr();
    window._bioRows = parseBiometricText(window._bioRaw, defaultDate);
    statusEl.textContent = window._bioRows.length
      ? 'Check the rows below, then press Save Photo & Attach.'
      : 'No names or times found in the photo. You can still tick employees above and save it.';
    renderBioRows();
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Could not read the photo. You can still tick employees above and save it.';
  }
};

    const tin = r.timeIn ? normalizeBioTime(r.timeIn) : '';

        <div style="flex:1;min-width:0;">
          <h3>${escBio(headerName)} ${isInactive ? '<span class="cmc-inactive-badge">Inactive</span>' : ''}</h3>
          <p>${staff.length} employee(s) — manage this department or its members below</p>
        </div>
        <div class="box-roster-actions">
          ${isSynthetic ? '' : `
            <button class="btn btn-outline btn-sm" onclick="editDepartment('${jsName}')"><i class="fas fa-pen"></i> Rename / Edit</button>
            <button class="btn ${isInactive ? 'btn-green' : 'btn-amber'} btn-sm" onclick="toggleDepartmentStatus('${jsName}')"><i class="fas ${isInactive ? 'fa-circle-check' : 'fa-ban'}"></i> ${isInactive ? 'Set Active' : 'Set Inactive'}</button>
            <button class="btn btn-red btn-sm" onclick="deleteDepartment('${jsName}')"><i class="fas fa-trash"></i> Remove</button>
          `}
          <button class="btn btn-navy btn-sm" title="Add an existing employee to this group" onclick="showAssignToDeptModal()"><i class="fas fa-user-plus"></i> Add Employee</button>
        </div>
        <button class="box-roster-close" onclick="selectDeptCard(null)"><i class="fas fa-times"></i></button>
      </div>
      <div class="dept-member-list">
        ${staff.length ? staff.map(e => `
          <div class="dept-member-row">
            <div style="min-width:0;">
              <div class="dept-member-name">${escBio(e.first)} ${escBio(e.last)}</div>
              <div class="dept-member-role">${escBio(e.position || 'No role set')}</div>
            </div>
            <button class="btn btn-outline btn-sm" title="Remove from ${escBio(headerName)}" onclick="removeFromDept('${e.id}','${jsName}')"><i class="fas fa-user-minus"></i></button>
          </div>
        `).join('') : '<div class="empty-state" style="padding:20px;"><p>No employees assigned yet.</p></div>'}
      </div>
    </div>
  `;
}

window.editDepartment = function(name) {
  const d = departments.find(x => x.name === name);
  if (!d) return;
  const jsName = d.name.replace(/'/g, "\\'");
  openModal(`
    <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    <h2 style="margin-top:0;">Edit Department</h2>
    <div class="field"><label>Department Name (rename it to something friendlier)</label><input id="ed_name" type="text" value="${escBio(d.name)}" /></div>
    <div class="field"><label>Department Head</label><input id="ed_head" type="text" value="${escBio(d.head || '')}" placeholder="e.g. Dr. Juan Dela Cruz" /></div>
    <div class="field"><label>Description</label><input id="ed_detail" type="text" value="${escBio(d.detail || '')}" /></div>
    <div class="field"><label>Status</label>
      <select id="ed_status"><option ${d.status==='Active'?'selected':''}>Active</option><option ${d.status==='Inactive'?'selected':''}>Inactive</option></select>
    </div>
    <p style="font-size:11.5px;color:var(--sub);margin:4px 0 0;">Renaming updates every employee, attendance record, leave request and report that uses this department.</p>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn btn-navy" style="flex:1" onclick="saveDepartmentEdit('${jsName}')"><i class="fas fa-save"></i> Save Changes</button>
    </div>
  `);
};

window.saveDepartmentEdit = async function(oldName) {
  const newName = document.getElementById('ed_name').value.trim();
  if (!newName) { showToast('Department name cannot be empty', 'fa-triangle-exclamation'); return; }
  const payload = {
    newName,
    head: document.getElementById('ed_head').value.trim() || 'Not Assigned',
    detail: document.getElementById('ed_detail').value.trim(),
    status: document.getElementById('ed_status').value
  };
  try {
    const res = await fetch(`${API_BASE_URL}/departments/${encodeURIComponent(oldName)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { showToast(data.error || 'Failed to update department', 'fa-triangle-exclamation'); return; }
    if (selectedDeptCard === oldName) selectedDeptCard = newName;
    await reloadAndRender();
    closeModal();
    showToast(newName !== oldName ? `Renamed to "${newName}"` : 'Department updated!');
  } catch (err) {
    showToast('Failed to update department', 'fa-triangle-exclamation');
  }
};

window.toggleDepartmentStatus = async function(name) {
  const d = departments.find(x => x.name === name);
  if (!d) return;
  const next = (d.status || 'Active') === 'Active' ? 'Inactive' : 'Active';
  if (next === 'Inactive' && !confirm(`Set "${name}" to Inactive? Its employees stay assigned, but the department will be marked inactive.`)) return;
  try {
    const res = await fetch(`${API_BASE_URL}/departments/${encodeURIComponent(name)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: next })
    });
    if (!res.ok) { showToast('Failed to change status', 'fa-triangle-exclamation'); return; }
    await reloadAndRender();
    showToast(`${name} is now ${next}`);
  } catch (err) {
    showToast('Failed to change status', 'fa-triangle-exclamation');
  }
};

window.deleteDepartment = async function(name) {
  const count = employees.filter(e => e.department === name).length;
  const msg = count
    ? `Remove "${name}"? Its ${count} employee(s) will become Unassigned (their records are kept). This cannot be undone.`
    : `Remove "${name}"? This cannot be undone.`;
  if (!confirm(msg)) return;
  try {
    const res = await fetch(`${API_BASE_URL}/departments/${encodeURIComponent(name)}`, { method: 'DELETE' });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      const hint = res.status === 404 ? ' (server not updated — restart/redeploy server.js)' : '';
      showToast((data.error || 'Failed to remove department') + ' [' + res.status + ']' + hint, 'fa-triangle-exclamation');
      return;
    }
    selectedDeptCard = null;
    await reloadAndRender();
    showToast(`"${name}" removed`);
  } catch (err) {
    showToast('Cannot reach the server — is it running?', 'fa-triangle-exclamation');
  }
};
